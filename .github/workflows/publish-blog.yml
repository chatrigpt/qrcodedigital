name: Publish scheduled SEO article

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish due articles and refresh SEO files
        run: python scripts/publish_blog.py
      - name: Commit published content
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to publish"
            exit 0
          fi
          git config user.name "Digital ADN SEO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html blog sitemap.xml
          git commit -m "chore: publish scheduled SEO content [skip ci]"
          git push
